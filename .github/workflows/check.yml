name: check page

# The landing page names a release tag per tool and four Action refs. Each one is a claim,
# and a claim nothing re-checks is how a page keeps advertising a version nobody installs.
# This runs the check on every push and once a week, so drift is reported by a workflow
# instead of by a reader who followed a stale install line.

on:
  push:
    branches: [main]
  schedule:
    - cron: "25 6 * * 1"   # Mondays, just after the claims check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The checker itself still fails when it should
        run: python3 check_page.py --self-test

      - name: The page matches the current releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 check_page.py --page index.html
